services:
  - type: keyvalue
    name: tourism-live-agent-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: tourism-live-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: prod
      - key: DEBUG
        value: "false"
      - key: AUTH_ALLOW_REGISTER
        value: "false"
      - key: DEMO_READ_ONLY
        value: "true"
      - key: DEMO_READ_ONLY_USERNAME
        value: demo_operator
      - key: SEED_DEMO_ON_START
        value: "true"
      - key: UPLOAD_DIR
        value: /tmp/enterprise-agent/uploads
      - key: RPA_SCREENSHOT_DIR
        value: /tmp/enterprise-agent/rpa
      - key: APP_RELOAD
        value: "false"
      - key: MYSQL_URL
        value: sqlite:////tmp/enterprise-agent/demo.db
      - key: VECTOR_BACKEND
        value: file
      - key: FILE_VECTOR_PATH
        value: /tmp/enterprise-agent/demo_vectors.json
      - key: REDIS_URL
        fromService:
          name: tourism-live-agent-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: portfolio_admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-flash
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: EMBEDDING_MODEL
        value: BAAI/bge-m3
